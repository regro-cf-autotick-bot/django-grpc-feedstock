{% set name = "django-grpc" %}
{% set version = "1.0.26" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 717736cde4ffe674a5638592f958d6b7c069b5daa5bf95090f6563554e24d05f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - grpcio-reflection >=1.70.0,<2.0.0
    - mirakuru
    - python >={{ python_min }}
    - setuptools
    - django >=4.2,<5.2
    - protobuf >=5.29.3,<6.0.0
    - grpcio >=1.70.0,<2.0.0
    - grpcio-tools >=1.70.0,<2.0.0

test:
  imports:
    - django_grpc
    - django_grpc_testtools
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/gluk-w/django-grpc
  summary: Easy Django based gRPC service
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
